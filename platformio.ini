; C.P.S. CardPuter Synth - CardputerADV / Cardputer synthesizer
; PlatformIO + Arduino framework

[env:cps]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 921600

; v0.9881: reverted to the Arduino ESP32 core's default -Os.
; v0.988 tried -O2. It did lower the average, but per-buffer PEAKS got
; worse and one buffer went over budget for the first time — the opposite
; of what more optimization is supposed to do. The likely reason is
; specific to this chip: code runs from flash through an instruction
; cache, and -O2's extra inlining and unrolling makes the hot path bigger,
; so it fits that cache less well. Average improves because the code is
; better; worst case degrades because a cache miss costs far more than the
; instructions saved. On a large ESP32 firmware -Os is often the faster
; choice in practice for exactly this reason. Leaving this note here so
; the flag doesn't get "re-optimized" back in later without remeasuring.

; NOTE: no PSRAM flags here, deliberately. Both boards this firmware runs
; on use an ESP32-S3FN8 (StampS3 / StampS3A) — the "FN8" part means 8MB
; flash and NO psram; a part with it would read R8. Declaring
; -DBOARD_HAS_PSRAM made the SDK hunt for a chip that is not fitted and
; fail at boot with "PSRAM chip not found", which reads alarmingly like a
; hardware fault and is not one. (-mfix-esp32-psram-cache-issue went with
; it, and was doubly irrelevant: it is an original-ESP32 erratum workaround
; that does not apply to the S3 at all.)
;
; The practical consequence is that internal DRAM is all there is, and it
; is tight: measured at boot, free heap is ~59KB before SD.begin() and
; ~31KB after, since mounting the card costs about 27KB on its own. Any
; feature needing a large buffer has to be weighed against that number —
; too little left and the card silently fails to mount, which presents as
; every setting having reset to default.

; USB MIDI: tried and abandoned (v0.9961-v0.9966). TinyUSB ate ~19KB of
; internal DRAM, which this board cannot spare alongside SD.begin's ~27KB,
; and even after freeing room elsewhere the board reset in a loop from a
; separate fault. Not planned for v1.0. Serial MIDI via a DIN unit (see
; main.cpp) is the supported path and costs almost nothing by comparison.
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; M5Cardputer library suite (includes M5Unified / M5GFX)
; v1.1.0 has a known bug with z/c/b/m key mapping -> require >= 1.1.1
; NOTE: original-Cardputer board auto-detection (M5.getBoard() ==
; m5::board_t::board_M5CardputerADV) needs a reasonably recent M5Unified
; release. If this fails to compile, try bumping the M5Unified version below.
; VL53L1X for the theremin (v0.999). Pololu's driver rather than M5's:
; it is small, takes any TwoWire instance — which matters here, since the
; keyboard already owns the default Wire — and does not drag in a unit
; framework. If it fails to build, the fallback is M5Unit-ToF4M.
lib_deps =
    pololu/VL53L1X @ ^1.3.1
    m5stack/M5Cardputer @ ^1.1.1
    m5stack/M5Unified @ ^0.2.8
    m5stack/M5GFX @ ^0.2.10

; Note: SD and SPI are part of the Arduino-ESP32 core;
; no extra lib_deps entry is needed.

; Post-build script: merges bootloader + partitions + firmware into
; a single file (.pio/build/cps/merge.bin)
; suitable for M5Burner or any single-file ESP32 flash tool.
extra_scripts = post:merge_bin.py
